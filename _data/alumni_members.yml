- name: Swanee Douglas
  photo: swanee.jpg
  role: MPhil student, Oct 2024 - Aug 2025
  info: Swanee spent a year in the lab as part of the MPhil course in Developmental Biology. Her project was focused on analysing segment-polarity and pair-rule gene patterns in fine detail. Over the course of the project she helped to greatly improve our multiplexed imaging protocols and had success in multiple image competitions.
  next_destination: PhD student, University of Oxford

- name: Aishani Chakraborty
  photo: aishani.jpg
