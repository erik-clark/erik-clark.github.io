- name: Erik Clark
  photo: erik.jpeg
  role: Group Leader
  info: I grew up in London and studied Biological Sciences at Oxford, where I became interested in evo-devo and anterior-posterior patterning. After a computational MSc at Imperial, I did my PhD in the Cambridge Department of Zoology with Michael Akam, studying <i>Drosophila</i> pair-rule gene regulation. As a postdoc I continued to work on <i>Drosophila</i> segmentation and its evolution, funded by a Junior Research Fellowship from Trinity College Cambridge and an EMBO postdoctoral fellowship hosted in Angela DePace's lab in Harvard Medical School. In 2023 I was awarded a Wellcome Trust Career Development Award to set up my research group in the Cambridge Department of Genetics. Alongside research I teach developmental biology and mathematical modelling for undergraduate and MPhil courses. Outside of the lab, most of my time is spent with my kids. When they're sleeping, I enjoy reading, history, and games.
  email: ec491@cam.ac.uk
  google_scholar: https://scholar.google.com/citations?user=2mHLASQAAAAJ&hl=en
