- name: Maciej (Maciek) Żurowski
  photo: maciek.jpg
  role: PhD student, funded by the Cambridge Trust
  info: I grew up in Kraków in Poland and moved to the UK to study Natural Sciences at Cambridge. During my studies, thanks to my supervisors and Summer research projects I got interested in evo-devo of patterning, interplay between modelling and experimental biology, and regulation of gene expression. I explored these interests further during my Bachelor's and Master's projects on the patterning of Hibiscus trionum petals in Edwige Moyroud's and Renske Vroomans' labs respectively, approaching the question from both the wet lab and computational perspectives. In 2024 I got funding from the Cambridge Trust to do a PhD in the Clark lab. I am using microscopy, molecular biology, and modelling to look at the regulation and function of bHLH genes in <i>Drosophila</i> segmentation. I also supervise first year Natural Sciences undergrads for IA Biomolecules and Cells, and I’m a trainer for the Cambridge Centre for Research Informatics Training. Outside of the lab I am an amateur cook and baker, and I enjoy playing both video and board games.
  email: mmz27@cam.ac.uk
