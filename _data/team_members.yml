- name: James Hammond
  photo: james.jpeg
  role: Leverhulme Trust Early Career Fellow
  info: I grew up in Moray and completed my undergraduate degree in Biology and Mathematics at the University of St Andrews in 2020. Here I fell in love with segmentation and evo-devo, and in 2020 I joined Berta Verd’s group at the University of Oxford to study somitogenesis in the Lake Malawi cichlids <i>Astatotilapia calliptera</i> and <i>Rhamphochromis</i> sp. ‘chilingali’. In 2025 I joined the Clark Lab, where I am using a combination of mathematical modelling and microscopy to study the evolution of robust gap gene patterning in Diptera. Outside of the lab I’m a keen lepidopterist, birdwatcher, and hillwalker.
  email: jh2046@cam.ac.uk 
